name: Build ESP32S3 Firmware
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ESP-IDF
        uses: espressif/setup-espressif-idf@v1
        with:
          esp-idf-version: v5.3
          target: esp32s3

      - name: Build firmware
        run: |
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py build
          idf.py merged-bin

      - name: Upload merged bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/merged.bin
