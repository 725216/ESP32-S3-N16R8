name: ESP32S3 Build Firmware
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup ESP-IDF v5.3
        uses: espressif/setup-espressif-idf@v1
        with:
          esp-idf-version: v5.3
          target: esp32s3

      - name: Compile & Generate merged bin
        run: |
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py build
          idf.py merge-bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            build/merged-binary.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
