name: Build ESP32-S3 AI Firmware
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v4.4
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inject API Token into source code
        run: |
          sed -i "s|TOKEN_XIAOZHI|${{ secrets.TOKEN_XIAOZHI }}|g" main/app.c
          sed -i "s|TOKEN_COZE|${{ secrets.TOKEN_COZE }}|g" main/app.c
          sed -i "s|TOKEN_DOUBAO|${{ secrets.TOKEN_DOUBAO }}|g" main/app.c

      - name: Build firmware
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/merged-binary.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ai_chat_s3.bin
