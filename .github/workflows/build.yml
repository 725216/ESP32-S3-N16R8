name: Build ESP32S3 Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup ESP-IDF v5.2.1
        uses: espressif/setup-esp-idf@v1
        with:
          esp-idf-version: v5.2.1
          target: esp32s3

      - name: Build firmware
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: Copy firmware bins
        run: |
          cp build/*.bin ./
          cp build/bootloader/bootloader.bin ./
          cp build/partition_table/partition-table.bin ./
          ls -la *.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-output
          path: |
            *.bin
