name: Build ESP32-S3 HelloWorld OPI Patch Test
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Copy output bins
        run: |
          mkdir -p ./artifacts
          cp build/bootloader/bootloader.bin ./artifacts/
          cp build/partition_table/partition-table.bin ./artifacts/
          cp build/hello_world.bin ./artifacts/
          . /opt/esp/idf/export.sh
          esptool.py merge_bin --chip esp32s3 -o ./artifacts/merged.bin 0x1000 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/hello_world.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-output
          path: ./artifacts/*.bin
