name: Build ESP32S3
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IDF_TARGET: esp32s3
      COZE_TOKEN: ${{ secrets.COZE_TOKEN }}
      DOUBAO_APIKEY: ${{ secrets.DOUBAO_APIKEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup ESP-IDF
        uses: espressif/setup-idf@v5
        with:
          idf-version: v5.3.1
      - name: Build
        run: |
          idf.py set-target esp32s3
          idf.py build
